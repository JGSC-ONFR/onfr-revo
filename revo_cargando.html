<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Abriendo ONFR REVO…</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #14101f; color: #fff; font-family: "Segoe UI", sans-serif; }
  .box { text-align: center; width: min(420px, 85vw); }
  h1 { margin: 0 0 6px; font-size: 42px; letter-spacing: 2px;
       background: linear-gradient(90deg, #8b5cf6, #ec4899, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0 0 22px; opacity: .85; }
  .bar { height: 8px; border-radius: 4px; background: #2a2240; overflow: hidden; }
  .bar div { height: 100%; width: 40%; border-radius: 4px;
             background: linear-gradient(90deg, #8b5cf6, #ec4899, #f97316); animation: go 1.4s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #slow { margin-top: 18px; font-size: 14px; opacity: 0; transition: opacity .6s; }
</style>
</head>
<body>
<div class="box">
  <h1>ONFR REVO</h1>
  <p>Abriendo REVO…</p>
  <div class="bar"><div></div></div>
  <p id="slow">La primera vez tras encender el ordenador tarda un poco más</p>
</div>
<script>
  const url = "http://127.0.0.1:7860/";
  setTimeout(() => { document.getElementById("slow").style.opacity = 1; }, 15000);
  (function check() {
    fetch(url, { mode: "no-cors", cache: "no-store" })
      .then(() => location.replace(url))
      .catch(() => setTimeout(check, 500));
  })();
</script>
</body>
</html>
